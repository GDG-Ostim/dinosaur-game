<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2f8f3a">
  <title>Dino Run · GDG Ostim</title>
  <link rel="icon" href="assets/dino_base.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scene-bg"></div>

  <!-- GİRİŞ -->
  <section id="screen-login" class="screen">
    <img class="logo" src="assets/logo.png" alt="GDG Ostim Dino Run">
    <form id="login-form" class="panel">
      <div class="ribbon"><span>Hoş geldin!</span></div>
      <div class="panel-body">
        <p class="hint">Okul mailinle giriş yap, koş, zıpla ve liderlik tablosunun zirvesine çık!</p>
        <label class="field">
          <span>Oyuncu adın</span>
          <input id="login-name" name="name" maxlength="20" autocomplete="nickname" placeholder="ör. Dino Avcısı" required>
        </label>
        <label class="field">
          <span>Okul mailin</span>
          <input id="login-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off"
                 placeholder="ad.soyad@atostimteknik.edu.tr" required>
        </label>
        <p id="login-error" class="error" hidden></p>
        <button class="btn btn-green btn-big" type="submit">Hadi Başla!</button>
      </div>
    </form>
  </section>

  <!-- MENÜ -->
  <section id="screen-menu" class="screen">
    <div class="topbar">
      <div class="chip chip-user"><span class="chip-icon">🦖</span><span id="menu-name">—</span></div>
      <button id="btn-logout" class="btn btn-red btn-small" title="Çıkış">Çıkış</button>
    </div>
    <img class="logo" src="assets/logo.png" alt="GDG Ostim Dino Run">
    <div class="hero">
      <img class="hero-dino bob" src="assets/dino_base.png" alt="">
    </div>
    <div class="stats">
      <div class="stat"><img src="assets/coin.png" alt=""><div><small>En iyi skor</small><b id="menu-best">0</b></div></div>
      <div class="stat"><span class="stat-trophy">🏆</span><div><small>Sıralama</small><b id="menu-rank">—</b></div></div>
    </div>
    <div class="menu-actions">
      <button id="btn-play" class="btn btn-green btn-huge">Oyna</button>
      <button id="btn-board" class="btn btn-blue btn-big">Liderlik Tablosu</button>
    </div>
  </section>

  <!-- OYUN -->
  <section id="screen-game" class="screen screen-game">
    <canvas id="game"></canvas>
    <div class="hud">
      <button id="btn-quit" class="btn btn-icon btn-red" title="Menü">✕</button>
      <div class="chip chip-score"><img src="assets/coin.png" alt=""><span id="hud-score">0</span></div>
      <div class="chip chip-best"><small>EN İYİ</small><span id="hud-best">0</span></div>
      <button id="btn-mute" class="btn btn-icon btn-blue" title="Ses">🔊</button>
    </div>
    <div id="tap-hint" class="tap-hint">
      <div class="tap-card">
        <b>Zıplamak için dokun!</b>
        <small>Klavye: Boşluk / ↑ zıpla · ↓ eğil</small>
      </div>
    </div>
  </section>

  <!-- OYUN BİTTİ -->
  <div id="modal-over" class="modal" hidden>
    <div class="panel panel-pop">
      <div class="ribbon ribbon-red"><span>Oyun Bitti!</span></div>
      <div class="panel-body center">
        <img class="over-dino" src="assets/dino_dead.png" alt="">
        <div id="over-newbest" class="badge-new" hidden>⭐ Yeni Rekor! ⭐</div>
        <div class="over-score"><small>Skor</small><b id="over-score">0</b></div>
        <div class="over-row">
          <div class="mini"><small>En iyi</small><b id="over-best">0</b></div>
          <div class="mini"><small>Sıralama</small><b id="over-rank">—</b></div>
        </div>
        <p id="over-error" class="error" hidden></p>
        <button id="btn-again" class="btn btn-green btn-big">Tekrar Oyna</button>
        <div class="btn-row">
          <button id="btn-over-board" class="btn btn-blue">Liderlik</button>
          <button id="btn-over-menu" class="btn btn-orange">Menü</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LİDERLİK -->
  <section id="screen-board" class="screen">
    <div class="board panel">
      <div class="ribbon ribbon-gold"><span>Liderlik Tablosu</span></div>
      <button id="btn-board-close" class="btn btn-icon btn-red panel-close" title="Kapat">✕</button>
      <p class="board-sub">Koş, zıpla, zirveye çık! <span id="board-total"></span></p>
      <ol id="board-list" class="board-list"></ol>
      <div id="board-me" class="board-me"></div>
      <button id="btn-board-play" class="btn btn-green btn-big">Oyna</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
